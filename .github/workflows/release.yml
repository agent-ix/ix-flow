name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm Trusted Publishing (no-op for token-based GH Packages)

jobs:
  windows-providers:
    uses: ./.github/workflows/windows-providers.yml
  ci:
    needs: windows-providers
    uses: agent-ix/nodejs-actions/.github/workflows/release.yml@main
    with:
      npm_registry: https://registry.npmjs.org
      trusted_publish: true
